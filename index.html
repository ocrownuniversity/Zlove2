async function broadcastAnnouncement(adminUid, title, message, audienceUids) {
    const targets = (audienceUids && audienceUids.length) ? audienceUids : (await db.collection('users').get()).docs.map(d => d.id);
    await db.collection('announcements').add({
        title, message, sentBy: adminUid, audienceCount: targets.length, createdAt: FieldValue.serverTimestamp()
    });
    // Fan out as a notification item per user (batched in chunks of 400 writes).
    let batch = db.batch(), count = 0;
    for (const uid of targets) {
        const ref = db.collection('notifications').doc(uid).collection('items').doc();
        batch.set(ref, { type: 'announcement', title, message, read: false, createdAt: FieldValue.serverTimestamp() });
        count++;
        if (count % 400 === 0) { await batch.commit(); batch = db.batch(); }
    }
    await batch.commit();
}

function exportToCsv(filename, rows) {
    if (!rows || !rows.length) return;
    const headers = Object.keys(rows[0]);
    const escape = (v) => { const s = v === null || v === undefined ? '' : String(v); return '"' + s.replace(/"/g, '""') + '"'; };
    const csv = [headers.join(',')].concat(rows.map(r => headers.map(h => escape(r[h])).join(','))).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

    const [toasts, setToasts] = useState([]);
    const push = useCallback((message, type = 'info') => {
        const id = Math.random().toString(36).slice(2);
        setToasts(t => [...t, { id, message, type }]);
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), type === 'error' ? 8000 : 3200);
    }, []);
    return (React.createElement(ToastContext.Provider, { value: push },
        children,
        React.createElement("div", { className: "fixed bottom-4 right-4 z-[100] space-y-2 w-[90vw] max-w-sm" }, toasts.map(t => (React.createElement("div", { key: t.id, className: "fade-in rounded-xl px-4 py-3 shadow-lg text-sm font-medium text-white " +
                (t.type === 'error' ? 'bg-red-500' : t.type === 'success' ? 'bg-emerald-500' : 'bg-ink-800') }, t.message))))));
}
