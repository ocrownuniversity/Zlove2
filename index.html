function captureVideoFrame(videoFile) {
    return new Promise((resolve) => {
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.muted = true;
        video.playsInline = true;
        video.src = URL.createObjectURL(videoFile);
        video.onloadeddata = () => {
            try { video.currentTime = Math.min(0.4, (video.duration || 1) / 4); }
            catch (e) { resolve(null); }
        };
        video.onseeked = () => {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 720;
                canvas.height = video.videoHeight || 1280;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(blob => { URL.revokeObjectURL(video.src); resolve(blob); }, 'image/jpeg', 0.85);
            } catch (e) { URL.revokeObjectURL(video.src); resolve(null); }
        };
        video.onerror = () => { URL.revokeObjectURL(video.src); resolve(null); };
        setTimeout(() => resolve(null), 6000);
    });
}
function readVideoMeta(videoFile) {
    return new Promise((resolve) => {
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.src = URL.createObjectURL(videoFile);
        video.onloadedmetadata = () => { resolve({ duration: Math.round(video.duration || 0), width: video.videoWidth || 0, height: video.videoHeight || 0 }); URL.revokeObjectURL(video.src); };
        video.onerror = () => resolve({ duration: 0, width: 0, height: 0 });
        setTimeout(() => resolve({ duration: 0, width: 0, height: 0 }), 6000);
    });
}
function extractHashtags(caption) {
    const matches = (caption || '').match(/#[a-z0-9_]+/gi) || [];
    return Array.from(new Set(matches.map(h => h.slice(1).toLowerCase())));
}
async function uploadReelMedia(authorId, reelId, videoFile, thumbBlob, onProgress) {
    const videoRef = storage.ref(`reels/${authorId}/${reelId}/video.mp4`);
    await new Promise((resolve, reject) => {
        const task = videoRef.put(videoFile, { contentType: videoFile.type || 'video/mp4' });
        task.on('state_changed', s => onProgress && onProgress(Math.round((s.bytesTransferred / s.totalBytes) * 90)), reject, resolve);
    });
    const videoURL = await videoRef.getDownloadURL();
    let thumbURL = null;
    if (thumbBlob) {
        const thumbRef = storage.ref(`reels/${authorId}/${reelId}/thumb.jpg`);
        await thumbRef.put(thumbBlob, { contentType: 'image/jpeg' });
        thumbURL = await thumbRef.getDownloadURL();
    }
    onProgress && onProgress(100);
    return { videoURL, thumbURL };
}

/* ============================== PAGE NAME CHANGE APPROVAL SYSTEM ==============================
 * Page owners can never rename a Page instantly — every rename goes through a request that an
 * admin must approve. Two collections back this:
 *  - pageNames/{normalizedKey}            reservation doc, one per live Page name, keyed by a
 *                                          case/whitespace-insensitive normalization of the name
 *                                          (mirrors the pageUsernames pattern above) so names are
 *                                          guaranteed globally unique regardless of case/spacing.
 *  - pageNameChangeRequests/{requestId}   one doc per submitted request, carrying the current
 *                                          name, requested name, reason, status, and admin decision.
 * A Page can only ever have one *pending* request at a time (see submitPageNameChangeRequest).
 */
const PAGE_NAME_CHANGE_MIN_REASON_LENGTH = 20;
// Case-insensitive, whitespace-collapsed key so "My Store", "my store", and "MY  STORE" are all
// treated as the same name.
function normalizePageNameKey(name) {
    return (name || '').trim().toLowerCase().replace(/\s+/g, ' ');
}
async function isPageNameTaken(name, excludePageId) {
    const key = normalizePageNameKey(name);
    if (!key) return false;
    const snap = await db.collection('pageNames').doc(key).get();
    return snap.exists && snap.data().pageId !== excludePageId;
}
// Owner submits a request to rename their Page. Validates the mandatory 20+ character reason,
// blocks a second simultaneous pending request for the same Page, and checks name availability
// up front (checked again at approval time, since availability can change while pending).
async function submitPageNameChangeRequest(page, profileId, requestedName, reason) {
    const trimmedName = (requestedName || '').trim();
    const trimmedReason = (reason || '').trim();
    if (!trimmedName)
        throw new Error('Please enter the new Page name.');
    if (trimmedReason.length < PAGE_NAME_CHANGE_MIN_REASON_LENGTH)
        throw new Error('Please provide a reason of at least ' + PAGE_NAME_CHANGE_MIN_REASON_LENGTH + ' characters.');
    const key = normalizePageNameKey(trimmedName);
    if (key === normalizePageNameKey(page.displayName))
        throw new Error("That's already this Page's current name.");
    const existingPending = await db.collection('pageNameChangeRequests')
        .where('pageId', '==', page.id).where('status', '==', 'pending').limit(1).get();
    if (!existingPending.empty)
        throw new Error('This Page already has a pending name change request.');
    if (await isPageNameTaken(trimmedName, page.id))
        throw new Error('That Page name is already in use. Please choose another.');
    const ref = db.collection('pageNameChangeRequests').doc();
    await ref.set({
        pageId: page.id, ownerId: profileId, currentName: page.displayName || '',
        requestedName: trimmedName, requestedNameKey: key, reason: trimmedReason,
        status: 'pending', submittedAt: FieldValue.serverTimestamp(),
        decidedAt: null, decidedBy: null, adminNotes: null,
    });
    notifyPageOwner(profileId, page.id, 'page_name_change_submitted', { requestedName: trimmedName });
    return ref.id;
}
// Admin approves a pending request. Re-verifies the requested name is still available (someone
// else may have grabbed it while this request sat pending) inside a transaction that atomically
// moves the pageNames reservation and updates the Page's displayName, so the two can never
// drift out of sync. Throws (and leaves the request pending) if the name was taken meanwhile.
async function adminApprovePageNameChangeRequest(request, adminUid) {
    await db.runTransaction(async (tx) => {
        const reqRef = db.collection('pageNameChangeRequests').doc(request.id);
        const reqSnap = await tx.get(reqRef);
        if (!reqSnap.exists || reqSnap.data().status !== 'pending')
            throw new Error('This request is no longer pending.');
        const pageRef = db.collection('fanPages').doc(request.pageId);
        const pageSnap = await tx.get(pageRef);
        if (!pageSnap.exists)
            throw new Error('The Page no longer exists.');
        const newKey = request.requestedNameKey || normalizePageNameKey(request.requestedName);
        const newNameRef = db.collection('pageNames').doc(newKey);
        const newNameSnap = await tx.get(newNameRef);
        if (newNameSnap.exists && newNameSnap.data().pageId !== request.pageId)
            throw new Error('That Page name was taken by another Page while this request was pending. Approval cancelled.');
        const oldKey = normalizePageNameKey(pageSnap.data().displayName);
        tx.set(newNameRef, { pageId: request.pageId });
        if (oldKey && oldKey !== newKey)
            tx.delete(db.collection('pageNames').doc(oldKey));
        tx.update(pageRef, { displayName: request.requestedName });
        tx.update(reqRef, { status: 'approved', decidedAt: FieldValue.serverTimestamp(), decidedBy: adminUid, adminNotes: null });
    });
    notifyPageOwner(request.ownerId, request.pageId, 'page_name_change_approved', { requestedName: request.requestedName });
}
async function adminRejectPageNameChangeRequest(request, adminUid, adminNotes) {
    const notes = (adminNotes || '').trim() || null;
    await db.collection('pageNameChangeRequests').doc(request.id).update({
        status: 'rejected', decidedAt: FieldValue.serverTimestamp(), decidedBy: adminUid, adminNotes: notes,
    });
    notifyPageOwner(request.ownerId, request.pageId, 'page_name_change_rejected', { requestedName: request.requestedName, adminNotes: notes });
}
// Admin-only instant rename — skips the owner request/approval flow entirely (an admin doing
// this directly doesn't need to approve their own action). Used from the Pages admin panel to
// resolve duplicate/legacy Page names that predate the pageNames uniqueness reservation system
// (e.g. Pages created before that system existed, or restored from a backup) — the normal
// createFanPage/adminApprovePageNameChangeRequest paths only ever prevent *new* collisions, they
// don't retroactively fix Pages that already share a name. Still runs inside a transaction so the
// pageNames reservation and the Page's displayName can never drift out of sync.
async function adminForceRenamePage(page, newName, adminUid) {
    const trimmedName = (newName || '').trim();
    if (!trimmedName) throw new Error('Please enter a new Page name.');
    const newKey = normalizePageNameKey(trimmedName);
    if (newKey === normalizePageNameKey(page.displayName))
        throw new Error("That's already this Page's current name.");
    await db.runTransaction(async (tx) => {
        const newNameRef = db.collection('pageNames').doc(newKey);
        const newNameSnap = await tx.get(newNameRef);
        if (newNameSnap.exists && newNameSnap.data().pageId !== page.id)
            throw new Error('That Page name is already in use by another Page.');
        const pageRef = db.collection('fanPages').doc(page.id);
        const oldKey = normalizePageNameKey(page.displayName);
        tx.set(newNameRef, { pageId: page.id });
        if (oldKey && oldKey !== newKey) {
            const oldNameRef = db.collection('pageNames').doc(oldKey);
            const oldNameSnap = await tx.get(oldNameRef);
            // Only delete the old reservation if it actually still points at this Page — a
            // duplicate that predates the reservation system may not own it (or another Page may
            // legitimately hold it), so blindly deleting could free up someone else's name.
            if (oldNameSnap.exists && oldNameSnap.data().pageId === page.id)
                tx.delete(oldNameRef);
        }
        tx.update(pageRef, { displayName: trimmedName });
    });
    notifyPageOwner(page.ownerId, page.id, 'page_name_change_approved', { requestedName: trimmedName });

// Groups a list of fanPages by normalized display-name key so the admin panel can flag Pages
// that share a name — this covers legacy duplicates that predate the pageNames uniqueness
// reservation (see adminForceRenamePage above), which the live create/rename flows can no longer
// produce going forward but can't retroactively clean up on their own.
function findDuplicatePageNameGroups(fanPages) {
    const byKey = new Map();
    for (const p of fanPages) {
        const key = normalizePageNameKey(p.displayName);
        if (!key) continue;
        if (!byKey.has(key)) byKey.set(key, []);
        byKey.get(key).push(p);
    }
    return Array.from(byKey.values()).filter(group => group.length > 1);

 *  - fanPages/{pageId}         gains: kycStatus ('none'|'pending'|'verified'|'rejected'),
 *                                monetizationStatus ('none'|'pending'|'approved'|'rejected'|'suspended'),
 *                                monetizationEnabled (bool, true only while monetizationStatus === 'approved')
 *  - pageKyc/{pageId}          one KYC application per Page (re-submitting overwrites it and
 *                        resets status back to 'pending' so admins always review the
 *                        latest submission — never more than one live application per Page).

const MONETIZATION_FOLLOWERS_REQUIRED = 1000;

// Human-readable labels for every KYC status, used consistently across the owner-facing
// Monetization screen, the KYC form, and the admin review panel.
const KYC_STATUS_LABELS = { none: 'Not Started', pending: 'Pending Review', verified: 'Verified', rejected: 'Rejected' };
// Human-readable labels for every monetization application status.
const MONETIZATION_STATUS_LABELS = { none: 'Not Eligible', eligible: 'Eligible to Apply', pending: 'Pending Review', approved: 'Approved', rejected: 'Rejected', suspended: 'Suspended' };
// Single source of truth for "is this Page eligible to apply for monetization" — used by both
// the owner's Monetization screen (to show/gate the Apply button) and mirrored into security
// rules. Followers are read live (see useFollowersCount) rather than from a denormalized
// counter, since this app deliberately avoids drift-prone follower counters elsewhere too.
function computePageEligibility(kycStatus, followersCount, followersRequired) {
    const kycApproved = kycStatus === 'verified';
    const followersMet = (followersCount || 0) >= (followersRequired || MONETIZATION_FOLLOWERS_REQUIRED);
    return { eligible: kycApproved && followersMet, kycApproved, followersMet };
}
// Derives the single status shown to the Page owner: "none" (Not Eligible) until both KYC and
// follower requirements are met, "eligible" (Eligible to Apply) once they are and no
// application is in flight, then mirrors whatever the live application status is once one
// exists (pending/approved/rejected/suspended).
function computeMonetizationDisplayStatus(eligible, appStatus) {
    if (appStatus === 'pending' || appStatus === 'approved' || appStatus === 'suspended') return appStatus;
    if (appStatus === 'rejected' && !eligible) return 'rejected';
    return eligible ? 'eligible' : 'none';
}

    await ref.put(compressed, { contentType: 'image/jpeg' });

// Creates or re-submits a Page's KYC application. Re-submission (after a rejection) simply
// overwrites the single pageKyc/{pageId} doc and flips status back to 'pending' — Firestore's
// one-doc-per-page id naturally prevents duplicate/parallel applications for the same Page.
async function submitPageKyc(page, profileId, fields, files) {
    const [govIdURL, selfieURL] = await Promise.all([
        uploadPageKycImage(page.id, files.govId, 'govId'),
        uploadPageKycImage(page.id, files.selfie, 'selfie'),
    ]);
    await db.collection('pageKyc').doc(page.id).set({
        pageId: page.id, ownerId: profileId, pageDisplayName: page.displayName, pageUsername: page.username || '',
        fullName: fields.fullName.trim(), dob: fields.dob, country: fields.country.trim(), state: fields.state.trim(),
        address: fields.address.trim(), phone: fields.phone.trim(), email: fields.email.trim(),
        idType: fields.idType, bankAccountName: fields.bankAccountName.trim(), bankAccountNumber: fields.bankAccountNumber.trim(),
        bankName: fields.bankName.trim(),
        govIdURL, selfieURL, status: 'pending', rejectionReason: FieldValue.delete(),
        submittedAt: FieldValue.serverTimestamp(), reviewedAt: null, reviewedBy: null,
    }, { merge: true });
    await db.collection('fanPages').doc(page.id).update({ kycStatus: 'pending' });
}

// action, so it carries pageId (not fromUserId) — see SYSTEM_NOTIF_TYPES / NotifRow.

// Fires the "reached 1,000 followers" and "eligible for monetization" notifications exactly
// once each, guarded by flags on the fanPages doc so they never repeat. Called after any event
// that could change eligibility (a new follower, or a KYC approval).
async function checkAndNotifyMilestones(pageId) {
    const [pageSnap, followsSnap, settingsSnap] = await Promise.all([
        db.collection('fanPages').doc(pageId).get(),
        db.collection('pageFollows').where('pageId', '==', pageId).get(),
        db.collection('settings').doc('site').get().catch(() => null),
    ]);
    if (!pageSnap.exists) return;
    const page = pageSnap.data();
    const followersCount = followsSnap.size;
    const required = (settingsSnap && settingsSnap.exists && settingsSnap.data().minFollowersRequired) || MONETIZATION_FOLLOWERS_REQUIRED;
    const updates = {};
    if (followersCount >= required && !page.milestone1000Notified) {
        notifyPageOwner(page.ownerId, pageId, 'followers_milestone', { count: followersCount });
        updates.milestone1000Notified = true;
    }
    if (page.kycStatus === 'verified' && followersCount >= required && !page.eligibilityNotified) {
        notifyPageOwner(page.ownerId, pageId, 'monetization_eligible', {});
        updates.eligibilityNotified = true;
    }
    if (Object.keys(updates).length) db.collection('fanPages').doc(pageId).update(updates).catch(() => { });
}

}

/* ============================== PAGE MONETIZATION: EARNINGS ==============================
 *  - fanPages/{pageId}   gains: earningsBalance (available to withdraw), lifetimeEarnings,
 *                          lifetimeWithdrawn (all numbers, kobo/naira units up to the caller)
 *  - pageEarningsLog/{autoId}   one doc per manual earnings adjustment, for a paper trail.
 */
// Admin manually credits or debits a monetized Page's balance (e.g. ad-revenue share for the
// period). Positive amount = credit, negative = debit/correction. Logged for auditability and
// notifies the owner either way.
async function adminAdjustEarnings(page, adminUid, amount, note) {
    const amt = Number(amount) || 0;
    if (!amt) throw new Error('Enter a non-zero amount.');
    await db.collection('fanPages').doc(page.id).update({
        earningsBalance: FieldValue.increment(amt),
        lifetimeEarnings: FieldValue.increment(amt > 0 ? amt : 0),
    });
    await db.collection('pageEarningsLog').add({
        pageId: page.id, ownerId: page.ownerId, amount: amt, note: (note || '').trim(),
        adminUid, createdAt: FieldValue.serverTimestamp(),
    });
    notifyPageOwner(page.ownerId, page.id, 'earnings_updated', { amount: amt });
}
/* ============================== PAGE MONETIZATION: WITHDRAWALS ==============================
 *  - withdrawalRequests/{autoId}   pageId, ownerId, amount, bank details, status
 *      ('pending'|'approved'|'rejected'|'paid'), requestedAt/reviewedAt/paidAt, reasons.
 * The requested amount is deducted from earningsBalance immediately on submission (an escrow
 * hold) so a Page can never request more than its available balance twice over. Rejecting a
 * request refunds the hold back to the balance.
 */
async function requestWithdrawal(page, kyc, amount, settings) {
    const amt = Number(amount) || 0;
    if (page.kycStatus !== 'verified') throw new Error('KYC must be verified before you can withdraw.');
    if (!page.monetizationEnabled || page.monetizationStatus !== 'approved') throw new Error('Monetization must be approved before you can withdraw.');
    if (!settings.withdrawalsEnabled) throw new Error('Withdrawals are temporarily disabled by the platform.');
    const balance = page.earningsBalance || 0;
    const minAmt = settings.minWithdrawalAmount || 0;
    if (amt < minAmt) throw new Error(`Minimum withdrawal amount is ${minAmt.toLocaleString()}.`);
    if (amt > balance) throw new Error('Amount exceeds your available balance.');
    const ref = db.collection('withdrawalRequests').doc();
    await ref.set({
        pageId: page.id, ownerId: page.ownerId, pageDisplayName: page.displayName, pageUsername: page.username || '',
        amount: amt, balanceBefore: balance, status: 'pending',
        bankAccountName: (kyc && kyc.bankAccountName) || '', bankAccountNumber: (kyc && kyc.bankAccountNumber) || '', bankName: (kyc && kyc.bankName) || '',
        requestedAt: FieldValue.serverTimestamp(), reviewedAt: null, reviewedBy: null, rejectionReason: null, paidAt: null, paidBy: null,
    });
    await db.collection('fanPages').doc(page.id).update({ earningsBalance: FieldValue.increment(-amt) });
    return ref.id;
}
async function adminApproveWithdrawal(w, adminUid) {
    await db.collection('withdrawalRequests').doc(w.id).update({ status: 'approved', reviewedAt: FieldValue.serverTimestamp(), reviewedBy: adminUid });
    notifyPageOwner(w.ownerId, w.pageId, 'withdrawal_approved', { withdrawalId: w.id, amount: w.amount });

    await db.collection('withdrawalRequests').doc(w.id).update({ status: 'rejected', reviewedAt: FieldValue.serverTimestamp(), reviewedBy: adminUid, rejectionReason: reason || '' });
    // Refund the escrowed amount back to the Page's available balance.
    await db.collection('fanPages').doc(w.pageId).update({ earningsBalance: FieldValue.increment(w.amount) });
    notifyPageOwner(w.ownerId, w.pageId, 'withdrawal_rejected', { withdrawalId: w.id, amount: w.amount, reason: reason || '' });

async function broadcastAnnouncement(adminUid, title, message, audienceUids) {
    const targets = (audienceUids && audienceUids.length) ? audienceUids : (await db.collection('users').get()).docs.map(d => d.id);
    await db.collection('announcements').add({
        title, message, sentBy: adminUid, audienceCount: targets.length, createdAt: FieldValue.serverTimestamp()
    });
    // Fan out as a notification item per user (batched in chunks of 400 writes).
    let batch = db.batch(), count = 0;
    for (const uid of targets) {
        const ref = db.collection('notifications').doc(uid).collection('items').doc();
        batch.set(ref, { type: 'announcement', title, message, read: false, createdAt: FieldValue.serverTimestamp() });
        count++;
        if (count % 400 === 0) { await batch.commit(); batch = db.batch(); }
    }
    await batch.commit();
}

function exportToCsv(filename, rows) {
    if (!rows || !rows.length) return;
    const headers = Object.keys(rows[0]);
    const escape = (v) => { const s = v === null || v === undefined ? '' : String(v); return '"' + s.replace(/"/g, '""') + '"'; };
    const csv = [headers.join(',')].concat(rows.map(r => headers.map(h => escape(r[h])).join(','))).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
