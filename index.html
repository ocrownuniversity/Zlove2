<style>
:root{
  --primary:#1a5632; --primary-dark:#0f3d22; --primary-light:#4caf7d;
  --accent:#e6197f; --accent-dark:#c4126a;
  --bg:#f6faf7; --card:#ffffff; --text:#12251a; --muted:#607169;
  --border:#e3ede6; --danger:#e11d48; --warn:#d97706; --ok:#16a34a;
  --radius:16px; --shadow:0 8px 24px rgba(15,61,34,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); line-height:1.5; padding-bottom:70px;}
h1,h2,h3,h4{font-family:'Poppins',sans-serif;}
img{max-width:100%; display:block;}
a{text-decoration:none; color:inherit;}
button{font-family:inherit; cursor:pointer; border:none;}
.hidden{display:none !important;}
.container{max-width:1200px; margin:0 auto; padding:0 16px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 22px; border-radius:999px; font-weight:600; font-size:14px; transition:.2s;}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:transparent; border:2px solid var(--primary); color:var(--primary);}

/* WEIGHT RESET PROGRAM PAGE */
.wr-hero{background:linear-gradient(135deg,#fff0f7,var(--bg)); text-align:center; padding:44px 16px 28px; border-radius:var(--radius); margin-bottom:0;}
.wr-hero h1{font-size:24px; margin-bottom:10px; line-height:1.3;}
.wr-hero p{color:var(--muted); font-size:14px; max-width:480px; margin:0 auto 20px;}
.wr-hero .hero-btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
.btn-accent{background:var(--accent); color:#fff; box-shadow:0 6px 16px rgba(230,25,127,.35);}
.btn-accent-outline{background:transparent; border:2px solid var(--accent); color:var(--accent);}
.wr-subnav{display:flex; overflow-x:auto; gap:8px; padding:12px 4px; margin-bottom:18px; position:sticky; top:0; background:var(--bg); z-index:60; -webkit-overflow-scrolling:touch;}
.wr-subnav a{padding:8px 14px; border-radius:999px; background:#fff; box-shadow:var(--shadow); font-size:12.5px; font-weight:600; white-space:nowrap; color:var(--text); flex-shrink:0;}
.wr-subnav a:hover{color:var(--accent);}
.wr-section{scroll-margin-top:60px; margin-bottom:40px;}
.wr-stat-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 14px; text-align:center;}
.wr-stat-card .num{font-size:24px; font-weight:800; color:var(--accent);}
.wr-stat-card .lbl{font-size:11.5px; color:var(--muted); margin-top:4px;}
.wr-price-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; text-align:center; border:2px solid transparent;}
.wr-price-card.highlight{border-color:var(--accent);}
.wr-price-card .plan-name{font-weight:700; font-size:15px;}
.wr-price-card .amt{font-size:26px; font-weight:800; margin:8px 0; color:var(--primary-dark);}
.wr-price-card .amt span{font-size:12px; font-weight:500; color:var(--muted);}
.wr-price-card ul{list-style:none; text-align:left; margin:14px 0; font-size:12.5px; color:var(--muted);}
.wr-price-card li{padding:6px 0; border-bottom:1px solid var(--border);}
.wr-price-card li::before{content:'\2713  '; color:var(--ok); font-weight:700;}
.wr-program-step{display:flex; gap:14px; align-items:flex-start; margin-bottom:16px;}
.wr-program-step .step-num{width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
.wr-program-step h4{font-size:14px; margin-bottom:4px;}
.wr-program-step p{font-size:12.5px; color:var(--muted);}
.btn-outline:hover{background:var(--primary); color:#fff;}
.btn-sm{padding:7px 14px; font-size:12px; border-radius:8px;}
.btn-danger{background:var(--danger); color:#fff;}
.btn-block{width:100%;}
.btn-ghost{background:#eef7f5; color:var(--primary-dark);}

/* NAV */
header{position:sticky; top:0; z-index:100; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.05);}
.navbar{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; max-width:1200px; margin:0 auto;}
.logo{font-family:'Poppins'; font-weight:800; font-size:16px; color:var(--primary-dark); display:flex; align-items:center; gap:8px; line-height:1.1;}
.logo img{height:42px; width:42px; object-fit:contain; border-radius:50%;}
.logo .logo-text b{color:var(--accent);}
.logo .logo-sub{display:block; font-family:'Inter'; font-weight:600; font-size:9px; letter-spacing:.5px; color:var(--muted); text-transform:uppercase;}
.nav-icons{display:flex; align-items:center; gap:14px;}
.icon-btn{position:relative; font-size:20px; background:#eef7f5; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.badge{position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; font-size:10px; font-weight:700; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center;}
.menu-toggle{font-size:22px; background:none; display:block;}
.nav-links{display:none; flex-direction:column; gap:2px; background:#fff; border-top:1px solid var(--border);}
.nav-links.open{display:flex;}
.nav-links a{padding:14px 20px; font-weight:600; font-size:14px; color:var(--text); border-bottom:1px solid var(--border);}
.nav-links a.active{color:var(--primary);}

/* HERO */
.hero{background:linear-gradient(135deg,#0f3d22,#1a5632 55%,#c4126a); color:#fff; padding:50px 16px 60px; text-align:center;}
.hero .tagline{font-family:'Poppins'; font-style:italic; font-size:14px; opacity:.85; margin-bottom:10px;}
.hero h1{font-size:28px; margin-bottom:12px; line-height:1.3;}
.hero p{font-size:15px; opacity:.92; margin-bottom:24px; max-width:520px; margin-left:auto; margin-right:auto;}
.hero-btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
.hero-btns .btn-outline{border-color:#fff; color:#fff;}
.hero-btns .btn-outline:hover{background:#fff; color:var(--primary-dark);}

section{padding:40px 16px;}
.section-title{text-align:center; margin-bottom:28px;}
.section-title h2{font-size:22px; color:var(--primary-dark); margin-bottom:6px;}
.section-title p{color:var(--muted); font-size:14px;}

.grid{display:grid; gap:16px;}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}

.cat-card{background:var(--card); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); transition:.2s;}
.cat-card:hover{transform:translateY(-4px);}
.cat-card img{height:150px; object-fit:cover; width:100%;}
.cat-card .body{padding:16px;}
.cat-card h3{font-size:16px; margin-bottom:6px; color:var(--primary-dark);}
.cat-card p{font-size:13px; color:var(--muted); margin-bottom:12px;}

.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}
.product-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; position:relative; border:2px solid transparent;}
.product-card.popular{border-color:var(--accent);}
.product-card img{height:150px; object-fit:cover; width:100%; background:#eef7f5;}
.product-card .body{padding:18px; display:flex; flex-direction:column; gap:4px; flex:1;}
.product-card h4{font-size:15px; color:var(--text); font-weight:700; margin-top:2px; cursor:pointer;}
.product-card .cat-tag{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.4px;}
.pc-badge{position:absolute; top:-11px; left:50%; transform:translateX(-50%); background:#f0b429; color:#4a2e00; font-size:10.5px; font-weight:700; padding:5px 12px; border-radius:999px; white-space:nowrap; z-index:2; box-shadow:0 3px 8px rgba(0,0,0,.15);}
.price-row{display:flex; align-items:baseline; gap:8px; margin-top:4px;}
.price-now{font-weight:800; color:var(--text); font-size:24px;}
.price-old{text-decoration:line-through; color:var(--muted); font-size:13px;}
.pc-period{font-size:12px; color:var(--muted); margin-top:-2px;}
.pc-desc{font-size:13px; color:var(--muted); margin-top:6px;}
.pc-features{list-style:none; margin:10px 0 4px; padding-top:10px; border-top:1px solid var(--border);}
.pc-features li{padding:5px 0; font-size:12.5px; color:var(--text);}
.pc-features li::before{content:'\2713  '; color:var(--ok); font-weight:700;}
.pc-features li.excl{color:var(--muted);}
.pc-features li.excl::before{content:'\2013  '; color:var(--muted); font-weight:700;}
.pc-variants{margin:10px 0 4px; padding-top:10px; border-top:1px solid var(--border);}
.pc-variant-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:13px; color:var(--text); border-bottom:1px solid var(--border);}
.pc-variant-row:last-child{border-bottom:none;}
.pc-variant-row .vlabel{color:var(--muted);}
.pc-variant-row .vprice{font-weight:700; color:var(--primary-dark);}
.btn-accent-outline-sm{background:transparent; border:2px solid var(--accent); color:var(--accent); font-weight:700;}
.btn-accent-outline-sm:hover{background:var(--accent); color:#fff;}
.stock-tag{font-size:11px; font-weight:600;}
.stock-in{color:var(--ok);} .stock-out{color:var(--danger);}

.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
.filters input, .filters select{padding:10px 14px; border-radius:10px; border:1px solid var(--border); font-size:13px; flex:1; min-width:140px;}
.chip{padding:8px 14px; border-radius:999px; background:#eef7f5; color:var(--primary-dark); font-size:13px; font-weight:600; cursor:pointer;}
.chip.active{background:var(--primary); color:#fff;}

.steps{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.step{text-align:center;}
.step .num{width:44px; height:44px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; margin:0 auto 10px;}
.step h4{font-size:14px; margin-bottom:4px;}
.step p{font-size:13px; color:var(--muted);}

.doctor-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; text-align:center;}
.doctor-card img{width:80px; height:80px; border-radius:50%; object-fit:cover; margin:0 auto 10px; background:#eef7f5;}
.doctor-card h4{font-size:15px;}
.doctor-card .spec{color:var(--primary); font-size:12px; font-weight:600; margin-bottom:6px;}
.doctor-card p{font-size:12px; color:var(--muted); margin-bottom:10px;}

.testi-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}
.testi-card p{font-size:13px; color:var(--muted); margin-bottom:10px; font-style:italic;}
.testi-card strong{font-size:13px;}

.faq-item{border-bottom:1px solid var(--border); padding:14px 0;}
.faq-q{font-weight:600; font-size:14px; display:flex; justify-content:space-between; cursor:pointer;}
.faq-a{font-size:13px; color:var(--muted); margin-top:8px; display:none;}
.faq-item.open .faq-a{display:block;}

.contact-grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.contact-item{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; text-align:center;}
.contact-item .ic{font-size:24px; margin-bottom:8px;}

footer{background:#0f2027; color:#cde7e3; padding:30px 16px; text-align:center; font-size:13px;}
footer a{color:#5eead4; font-weight:600;}

.form-group{margin-bottom:14px;}
.form-group label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text);}
.form-group input, .form-group select, .form-group textarea{width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border); font-size:14px; font-family:inherit;}
.form-group textarea{resize:vertical; min-height:80px;}
.password-field{position:relative;}
.password-field input{padding-right:42px;}
.pw-toggle{position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; font-size:17px; padding:6px 8px; line-height:1; color:var(--muted);}
.auth-box{max-width:420px; margin:30px auto; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px;}
.auth-box h2{text-align:center; margin-bottom:18px; color:var(--primary-dark);}
.switch-link{text-align:center; font-size:13px; margin-top:14px; color:var(--muted);}
.switch-link a{color:var(--primary); font-weight:600;}

.tabs{display:flex; gap:8px; overflow-x:auto; margin-bottom:18px; padding-bottom:4px;}
.tab-btn{padding:9px 16px; border-radius:999px; background:#eef7f5; font-size:13px; font-weight:600; color:var(--primary-dark); white-space:nowrap;}
.tab-btn.active{background:var(--primary); color:#fff;}

table{width:100%; border-collapse:collapse; font-size:13px;}
table th, table td{padding:10px 8px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap;}
.table-wrap{overflow-x:auto; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px;}
.status-pill{padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700;}
.st-pending{background:#fef3c7; color:#92400e;} .st-confirmed{background:#dbeafe; color:#1e40af;}
.st-processing{background:#e0e7ff; color:#3730a3;} .st-shipped{background:#cffafe; color:#155e75;}
.st-delivered{background:#dcfce7; color:#166534;} .st-cancelled{background:#fee2e2; color:#991b1b;}

.stat-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; text-align:center;}
.stat-card .val{font-size:22px; font-weight:800; color:var(--primary-dark);}
.stat-card .lbl{font-size:12px; color:var(--muted);}

.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; display:flex; align-items:flex-end; justify-content:center;}
.modal-box{background:#fff; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:20px;}
@media(min-width:640px){.modal-overlay{align-items:center;} .modal-box{border-radius:var(--radius);}}
.modal-close{float:right; font-size:20px; background:#eef7f5; width:32px; height:32px; border-radius:50%;}

.cart-row{display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--border);}
.cart-row img{width:60px; height:60px; object-fit:cover; border-radius:10px; background:#eef7f5;}
.qty-ctrl{display:flex; align-items:center; gap:8px;}
.qty-ctrl button{width:26px; height:26px; border-radius:6px; background:#eef7f5; font-weight:700;}
.cart-summary{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-top:16px;}
.sum-row{display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px;}
.sum-row.total{font-weight:800; font-size:16px; border-top:1px solid var(--border); padding-top:8px; margin-top:8px;}

.chat-wrap{display:flex; flex-direction:column; height:65vh; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
.chat-msgs{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px;}
.msg{max-width:75%; padding:10px 14px; border-radius:14px; font-size:13px;}
.msg.me{align-self:flex-end; background:var(--primary); color:#fff; border-bottom-right-radius:4px;}
.msg.them{align-self:flex-start; background:#eef7f5; color:var(--text); border-bottom-left-radius:4px;}
.msg img{max-width:150px; border-radius:8px; margin-top:6px;}
.msg .time{font-size:10px; opacity:.7; margin-top:4px; display:block;}
.chat-input{display:flex; gap:8px; padding:10px; border-top:1px solid var(--border);}
.chat-input input[type=text]{flex:1; padding:10px 14px; border-radius:999px; border:1px solid var(--border);}
.chat-input button{width:40px; height:40px; border-radius:50%; background:var(--primary); color:#fff;}
.chat-input label{width:40px; height:40px; border-radius:50%; background:#eef7f5; display:flex; align-items:center; justify-content:center; font-size:18px;}
.chat-input .mic-btn{width:40px; height:40px; border-radius:50%; background:#eef7f5; color:var(--text); font-size:16px; flex-shrink:0;}
.chat-input .mic-btn.recording{background:#e03131; color:#fff; animation:mwPulse 1s infinite;}
@keyframes mwPulse{0%{box-shadow:0 0 0 0 rgba(224,49,49,.5);}70%{box-shadow:0 0 0 8px rgba(224,49,49,0);}100%{box-shadow:0 0 0 0 rgba(224,49,49,0);}}

.empty-state{text-align:center; padding:40px 16px; color:var(--muted);}
.loading{text-align:center; padding:30px; color:var(--muted); font-size:13px;}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#0f2027; color:#fff; padding:12px 20px; border-radius:999px; font-size:13px; z-index:2000; box-shadow:0 6px 20px rgba(0,0,0,.2);}
.wa-float{position:fixed; bottom:20px; right:16px; background:#25d366; color:#fff; width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; box-shadow:0 6px 16px rgba(0,0,0,.25); z-index:500;}

/* AI CHAT WIDGET */
.mw-chat-panel{position:fixed; bottom:0; right:0; left:0; top:0; background:#fff; z-index:1500; display:none; flex-direction:column; box-shadow:-4px 0 24px rgba(0,0,0,.2);}
.mw-chat-panel.open{display:flex;}
.mw-chat-head{background:linear-gradient(135deg,#0f3d22,#1a5632); color:#fff; padding:16px; display:flex; align-items:center; justify-content:space-between;}
.mw-chat-head h4{font-size:15px; margin-bottom:2px;}
.mw-chat-head span{font-size:11px; opacity:.85;}
.mw-chat-head button{background:rgba(255,255,255,.15); color:#fff; width:32px; height:32px; border-radius:50%; font-size:18px;}
.mw-chat-msgs{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--bg);}
.mw-msg{max-width:82%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.4;}
.mw-msg.user{align-self:flex-end; background:var(--primary); color:#fff; border-bottom-right-radius:4px;}
.mw-msg.bot{align-self:flex-start; background:#fff; color:var(--text); border:1px solid var(--border); border-bottom-left-radius:4px;}
.mw-msg.admin{align-self:flex-start; background:#fde6f0; color:var(--accent-dark); border-bottom-left-radius:4px;}
.mw-msg.admin::before{content:"Support Team"; display:block; font-size:10px; font-weight:700; text-transform:uppercase; margin-bottom:3px; opacity:.8;}
.mw-cta{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.mw-chat-input{display:flex; gap:8px; padding:10px; border-top:1px solid var(--border); background:#fff;}
.mw-chat-input input{flex:1; padding:11px 14px; border-radius:999px; border:1px solid var(--border); font-size:14px;}
.mw-chat-input button{width:42px; height:42px; border-radius:50%; background:var(--primary); color:#fff; font-size:16px;}
@media(min-width:640px){
  .mw-chat-panel{top:auto; left:auto; bottom:90px; right:16px; width:360px; height:520px; border-radius:18px; overflow:hidden;}
}

@media(min-width:860px){
  .menu-toggle{display:none;}
  .nav-links{display:flex !important; flex-direction:row; background:none; border:none;}
  .nav-links a{border:none; padding:8px 14px;}
  .hero h1{font-size:38px;}
  .hero p{font-size:16px;}
}
</style>
</head>
<body>

<header>

function compressImage(file, maxW, quality, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

auth.onAuthStateChanged(async user=>{

        currentUserData.role = 'admin';
        await db.collection('users').doc(user.uid).set(currentUserData, {merge:true});
      }
      isAdmin = currentUserData.role === 'admin';
      // Restore/merge the customer's saved cart so returning users find their items still there
      const serverCart = Array.isArray(currentUserData.cart) ? currentUserData.cart : [];
      if(serverCart.length){
        let addedAny = false;
        serverCart.forEach(si=>{
          const existing = cart.find(ci=>ci.id===si.id);
          if(existing){ if(si.qty>existing.qty){ existing.qty = si.qty; addedAny = true; } }
          else { cart.push(si); addedAny = true; }
        });
        if(addedAny){
          localStorage.setItem('mw_cart', JSON.stringify(cart));
          updateCartBadge();
          toast('Welcome back! Your saved cart items are here.');
        }
      } else if(cart.length){
        db.collection('users').doc(user.uid).set({cart}, {merge:true}).catch(()=>{});
      }
    }catch(err){ currentUserData = {name:user.email,email:user.email,role:'customer'}; isAdmin=false; }
  } else {
    currentUserData = null; isAdmin = false;
  }
  $('adminNavLink').classList.toggle('hidden', !isAdmin);
  $('logoutNavLink').classList.toggle('hidden', !currentUser);
});

/* ================= DATA LOADERS (with local cache for read efficiency) ================= */
const MW_CACHE_TTL = 10*60*1000; // 10 minutes - static-ish data doesn't need a fresh read every visit
function cacheGet(key){
  try{
    const raw = localStorage.getItem('mw_cache_'+key);
    if(!raw) return null;
    const {data, ts} = JSON.parse(raw);
    if(Date.now()-ts > MW_CACHE_TTL) return null;
    return data;
  }catch(e){ return null; }
}
function cacheSet(key, data){
  try{ localStorage.setItem('mw_cache_'+key, JSON.stringify({data, ts:Date.now()})); }catch(e){}
}
function cacheClear(key){ localStorage.removeItem('mw_cache_'+key); }

function starsHtml(avg, size){
  avg = avg || 0;
  const full = Math.round(avg);
  let out = '';
  for(let i=1;i<=5;i++) out += `<span style="color:${i<=full?'#f5a623':'#d8e0da'};font-size:${size||13}px;line-height:1;">\u2605</span>`;
  return out;
}
function productCardHtml(p){
  const inStock = (p.stockQty===undefined ? true : p.stockQty > 0);
  const priceValue = p.discountPrice || p.price;
  const features = (p.features||'').split('\n').map(f=>f.trim()).filter(Boolean);
  // Variants: one "Label - Price" per line, e.g. "2.5mg - 500000" -> rendered as its own row, not merged text
  const variants = (p.variants||'').split('\n').map(v=>v.trim()).filter(Boolean).map(line=>{
    const m = line.match(/^(.*?)[\s]*[-–:][\s]*₦?\s*([\d,\.]+)\s*(?:k|000)?$/i);
    if(!m) return {label: line, price: null};
    let priceStr = m[2].replace(/,/g,'');
    return {label: m[1].trim(), price: Number(priceStr)};
  });
  const waDigits = escapeHtml(siteSettings.contactPhone).replace(/^0/,'').replace(/\D/g,'');
  const waMsg = encodeURIComponent(`Hi, I'm interested in ${p.name} (${money(priceValue)}). Please tell me how to get started.`);
  return `
  <div class="product-card ${p.popular?'popular':''}">
    ${p.popular ? `<div class="pc-badge">⚡ MOST POPULAR</div>` : ''}
    <div class="body">
      <span class="cat-tag">${escapeHtml(catName(p.category))}</span>
      <h4 data-view-product="${p.id}">${escapeHtml(p.name)}</h4>
      <div class="price-row">
        <span class="price-now">${variants.length ? 'From '+money(priceValue) : money(priceValue)}</span>
        ${p.discountPrice ? `<span class="price-old">${money(p.price)}</span>` : ''}
      </div>
      ${p.period ? `<div class="pc-period">${escapeHtml(p.period)}</div>` : ''}
      ${p.description ? `<p class="pc-desc">${escapeHtml(p.description)}</p>` : ''}
      ${variants.length ? `<div class="pc-variants">${variants.map(v=>`
        <div class="pc-variant-row"><span class="vlabel">${escapeHtml(v.label)}</span><span class="vprice">${v.price!==null ? money(v.price) : ''}</span></div>`).join('')}</div>` : ''}
      ${features.length ? `<ul class="pc-features">${features.map(f=>{
        const excluded = f.startsWith('-');
        return `<li class="${excluded?'excl':''}">${escapeHtml(excluded ? f.slice(1).trim() : f)}</li>`;
      }).join('')}</ul>` : ''}
      <span class="stock-tag ${inStock?'stock-in':'stock-out'}" style="margin-top:8px;">${inStock?'In Stock':'Out of Stock'}</span>
      <a href="https://wa.me/234${waDigits}?text=${waMsg}" target="_blank" class="btn btn-accent-outline-sm btn-block" style="margin-top:10px;border-radius:999px;padding:11px 20px;">GET STARTED →</a>
      <button class="btn btn-sm btn-ghost btn-block" data-view-product="${p.id}" style="margin-top:8px;">View Details</button>
    </div>
  </div>`;
}
function catName(id){
  const c = allCategories.find(c=>c.id===id);
  return c ? c.name : (id||'Product');
}
function wireProductCards(containerId){
  delegate(containerId, '[data-view-product]', 'click', el=> openProductModal(el.dataset.viewProduct));
}
function doctorCardHtml(d){

  <div class="doctor-card">
    <img src="${escapeHtml(d.imageUrl||'')}" alt="Dr. ${escapeHtml(d.name)}" onerror="this.src='https://placehold.co/150x150?text=Dr'">

function openProductModal(id){
  const p = allProducts.find(p=>p.id===id);
  if(!p) return;
  const inStock = (p.stockQty===undefined ? true : p.stockQty > 0);
  let mwSelectedStars = 0;
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <button class="modal-close" data-close>&times;</button>
      <img src="${escapeHtml(p.imageUrl)}" alt="${escapeHtml(p.name)}" style="border-radius:12px;margin-bottom:12px;" onerror="this.src='https://placehold.co/400x300?text=Product'">
      <span class="cat-tag">${escapeHtml(catName(p.category))}</span>
      <h3 style="margin:6px 0;">${escapeHtml(p.name)}</h3>
      <div class="mw-rating-summary" style="margin-bottom:6px;">${p.reviewCount ? `${starsHtml(p.avgRating,14)} <span style="font-size:12px;color:var(--muted);">${(p.avgRating||0).toFixed(1)} (${p.reviewCount} review${p.reviewCount===1?'':'s'})</span>` : `<span style="font-size:12px;color:var(--muted);">No reviews yet</span>`}</div>
      <div class="price-row" style="margin-bottom:10px;">
        <span class="price-now" style="font-size:18px;">${money(p.discountPrice||p.price)}</span>
        ${p.discountPrice ? `<span class="price-old">${money(p.price)}</span>` : ''}
      </div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">${escapeHtml(p.description||'')}</p>
      <span class="stock-tag ${inStock?'stock-in':'stock-out'}">${inStock?'In Stock':'Out of Stock'}</span>
      <div style="margin-top:14px;">
        <button class="btn btn-primary btn-block" id="addToCartBtn" ${inStock?'':'disabled'}>${inStock?'Add to Cart':'Out of Stock'}</button>
      </div>
      <div class="mw-reviews" style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px;">
        <h4 style="font-size:14px;margin-bottom:8px;">Customer Reviews</h4>
        <div id="mwReviewList"><div class="loading">Loading reviews...</div></div>
        ${currentUser ? `
          <form id="mwReviewForm" style="margin-top:12px;">
            <div class="form-group"><label>Your Rating</label>
              <div id="mwStarPicker" style="font-size:26px;cursor:pointer;">${[1,2,3,4,5].map(n=>`<span data-star="${n}" style="color:#d8e0da;">\u2605</span>`).join('')}</div>
            </div>
            <div class="form-group"><textarea id="mwReviewText" placeholder="Share your experience with this product..." required></textarea></div>
            <button class="btn btn-sm btn-primary" type="submit">Submit Review</button>
          </form>` : `<p style="font-size:12px;color:var(--muted);margin-top:10px;">Please log in from "My Account" to leave a review.</p>`}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  mwLoadReviews(p.id, overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay || e.target.closest('[data-close]')) overlay.remove(); });
  overlay.querySelector('#addToCartBtn')?.addEventListener('click', ()=>{
    addToCart(p, 1);
    overlay.remove();
  });
  overlay.querySelector('#mwStarPicker')?.addEventListener('click', e=>{
    const star = e.target.closest('[data-star]');
    if(!star) return;
    mwSelectedStars = Number(star.dataset.star);
    overlay.querySelectorAll('#mwStarPicker [data-star]').forEach(el=>{
      el.style.color = Number(el.dataset.star) <= mwSelectedStars ? '#f5a623' : '#d8e0da';
    });
  });
  overlay.querySelector('#mwReviewForm')?.addEventListener('submit', async e=>{
    e.preventDefault();
    if(!mwSelectedStars){ toast('Please select a star rating'); return; }
    const comment = overlay.querySelector('#mwReviewText').value.trim();
    const btn = overlay.querySelector('#mwReviewForm button[type=submit]');
    btn.disabled = true; btn.textContent = 'Submitting...';
    try{
      const reviewRef = db.collection('reviews').doc();
      const prodRef = db.collection('products').doc(p.id);
      let newCount, newAvg;
      await db.runTransaction(async tx=>{
        const doc = await tx.get(prodRef);
        const cur = doc.data() || {};
        const oldCount = cur.reviewCount || 0;
        const oldAvg = cur.avgRating || 0;
        newCount = oldCount + 1;
        newAvg = ((oldAvg*oldCount) + mwSelectedStars) / newCount;
        tx.set(reviewRef, {productId:p.id, userId:currentUser.uid, userName:currentUserData?.name||'Customer', rating:mwSelectedStars, comment, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
        tx.update(prodRef, {reviewCount:newCount, avgRating:newAvg});
      });
      p.reviewCount = newCount; p.avgRating = newAvg;
      cacheClear('products');
      toast('Thanks for your review!');
      overlay.querySelector('#mwReviewForm').reset();
      mwSelectedStars = 0;
      overlay.querySelectorAll('#mwStarPicker [data-star]').forEach(el=> el.style.color='#d8e0da');
      overlay.querySelector('.mw-rating-summary').innerHTML = `${starsHtml(p.avgRating,14)} <span style="font-size:12px;color:var(--muted);">${p.avgRating.toFixed(1)} (${p.reviewCount} review${p.reviewCount===1?'':'s'})</span>`;
      mwLoadReviews(p.id, overlay);
    }catch(err){ toast(err.message); }
    finally{ btn.disabled=false; btn.textContent='Submit Review'; }
  });
}
async function mwLoadReviews(productId, overlay){
  const box = overlay.querySelector('#mwReviewList');
  if(!box) return;
  try{
    const snap = await db.collection('reviews').where('productId','==',productId).limit(50).get();
    let list = []; snap.forEach(d=> list.push({id:d.id, ...d.data()}));
    list.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    box.innerHTML = list.length ? list.map(r=>`
      <div style="padding:10px 0;border-bottom:1px solid var(--border);">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <strong style="font-size:13px;">${escapeHtml(r.userName||'Customer')}</strong>
          <span>${starsHtml(r.rating,12)}</span>
        </div>
        ${r.comment ? `<p style="font-size:12px;color:var(--muted);margin-top:4px;">${escapeHtml(r.comment)}</p>` : ''}
      </div>`).join('') : `<p class="empty-state" style="padding:16px 0;">No reviews yet \u2014 be the first!</p>`;
  }catch(err){
    box.innerHTML = `<p style="font-size:12px;color:var(--muted);">Reviews unavailable right now.</p>`;
  }
}
function addToCart(p, qty){
  const existing = cart.find(i=>i.id===p.id);
  if(existing) existing.qty += qty;
  else cart.push({id:p.id, name:p.name, price:p.discountPrice||p.price, imageUrl:p.imageUrl, qty});
  saveCart();
  toast('Added to cart');
}

/* ---- Voice note recording (shared by in-app consultation chat) ---- */
let mwRecorder = null, mwRecordChunks = [], mwRecordTimer = null;
function wireVoiceNoteButton(btnId, consultationId, senderRole){
  const btn = $(btnId);
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    if(mwRecorder && mwRecorder.state === 'recording'){ mwRecorder.stop(); return; }
    if(!navigator.mediaDevices?.getUserMedia){ toast('Voice notes are not supported on this browser'); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mwRecordChunks = [];
      mwRecorder = new MediaRecorder(stream);
      mwRecorder.ondataavailable = e=>{ if(e.data.size>0) mwRecordChunks.push(e.data); };
      mwRecorder.onstop = ()=>{
        clearTimeout(mwRecordTimer);
        btn.classList.remove('recording');
        stream.getTracks().forEach(t=>t.stop());
        const blob = new Blob(mwRecordChunks, {type:'audio/webm'});
        if(blob.size < 500){ return; } // ignore accidental taps
        const reader = new FileReader();
        reader.onload = ()=>{
          db.collection('messages').add({
            consultationId, sender: senderRole,
            senderName: senderRole==='customer' ? (currentUserData?.name||'You') : 'Doctor',
            audioData: reader.result, createdAt: firebase.firestore.FieldValue.serverTimestamp()
          }).catch(err=> toast(err.message));
        };
        reader.readAsDataURL(blob);
      };
      mwRecorder.start();
      btn.classList.add('recording');
      toast('Recording... tap again to send (max 30s)');
      mwRecordTimer = setTimeout(()=>{ if(mwRecorder && mwRecorder.state==='recording') mwRecorder.stop(); }, 30000);
    }catch(err){ toast('Microphone access denied'); }
  });
}
function sendChatMessage(){
  const text = $('chatText').value.trim();
  if(!text) return;
  db.collection('messages').add({
    consultationId: activeChatConsultationId, sender:'customer', senderName: currentUserData?.name||'You',
    message: text, createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  $('chatText').value = '';
}

  const payload = {};
  Object.keys(deltas).forEach(k=> payload[k] = firebase.firestore.FieldValue.increment(deltas[k]));
  db.collection('stats').doc('summary').set(payload, {merge:true}).catch(()=>{});
}

async function adminOrders(c){
  const snap = await db.collection('orders').get();
  let orders = []; snap.forEach(d=>orders.push({id:d.id,...d.data()}));
  orders.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  c.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Customer</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
    <tbody>${orders.map(o=>`
      <tr data-id="${o.id}">
        <td>${escapeHtml(o.customerName)}<br><span style="font-size:11px;color:var(--muted);">${escapeHtml(o.phone||'')}</span></td>
        <td>${money(o.total)}</td>
        <td><select data-status>
          ${['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
        </select></td>
        <td>${fmtDate(o.createdAt)}</td>
        <td><button class="btn btn-sm btn-ghost" data-view-order>View</button></td>
      </tr>`).join('') || '<tr><td colspan="5">No orders yet.</td></tr>'}</tbody></table></div>`;
  delegate('adminTabContent','[data-status]','change', async (el)=>{
    const id = el.closest('tr').dataset.id;
    const ord = orders.find(o=>o.id===id);
    const oldStatus = ord?.status || 'Pending';
    const newStatus = el.value;
    await db.collection('orders').doc(id).update({status: newStatus});
    if(ord) ord.status = newStatus;
    const delta = {};
    if(oldStatus==='Pending' && newStatus!=='Pending') delta.pendingOrders = -1;
    if(oldStatus!=='Pending' && newStatus==='Pending') delta.pendingOrders = 1;
    if(oldStatus!=='Delivered' && newStatus==='Delivered') delta.deliveredRevenue = (ord?.total||0);
    if(oldStatus==='Delivered' && newStatus!=='Delivered') delta.deliveredRevenue = -(ord?.total||0);
    if(Object.keys(delta).length) mwStatIncrement(delta);
    toast('Order status updated');
  });
  delegate('adminTabContent','[data-view-order]','click', el=>{
    const o = orders.find(o=>o.id===el.closest('tr').dataset.id);
    const overlay = document.createElement('div');
    overlay.className='modal-overlay';
    overlay.innerHTML = `<div class="modal-box"><button class="modal-close" data-close>&times;</button>
      <h3>Order Details</h3>
      <p style="font-size:13px;margin-top:10px;"><strong>${escapeHtml(o.customerName)}</strong><br>${escapeHtml(o.phone)} - ${escapeHtml(o.email)}</p>
      <p style="font-size:13px;margin-top:6px;">${escapeHtml(o.address)}, ${escapeHtml(o.city)}, ${escapeHtml(o.state)}</p>
      <div style="margin-top:12px;">${o.items.map(i=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);"><span>${escapeHtml(i.name)} x${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}</div>
      <div class="sum-row total" style="margin-top:10px;"><span>Total</span><span>${money(o.total)}</span></div>
    </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e=>{ if(e.target===overlay || e.target.closest('[data-close]')) overlay.remove(); });
  });
}

  const q = query.toLowerCase();
  const qWords = q.split(/\W+/).filter(w=>w.length>2);
  const prod = allProducts.find(p=> p.name && q.includes(p.name.toLowerCase()));
  if(prod){
    const priceTxt = prod.discountPrice ? `${money(prod.discountPrice)} (was ${money(prod.price)})` : money(prod.price);
    const stockTxt = (prod.stockQty ?? 0) > 0 ? 'It is currently in stock.' : 'It is currently out of stock.';
    return `${prod.name} — ${priceTxt}. ${stockTxt} ${prod.description||''}`.trim();
  }
  const doc = allDoctors.find(d=> d.name && q.includes(d.name.toLowerCase()));
  if(doc) return `Dr. ${doc.name}${doc.specialty ? ` (${doc.specialty})` : ''} — ${doc.description||'available for consultation.'} You can book via the "Consultation" menu.`;
  let best=null, bestScore=0;
  mwBuildKnowledgeBase().forEach(entry=>{
    let score=0;
    entry.k.forEach(kw=>{ if(kw && q.includes(kw)) score+=2; });
    qWords.forEach(w=>{ if(entry.k.some(kw=> kw && kw.includes(w))) score+=1; });
    if(score>bestScore){ bestScore=score; best=entry.a; }
  });
  if(bestScore>=2 && best) return best;
  return "I'm not fully sure about that one yet — but I can help with products, prices, delivery, orders, consultations or contact info. You can also ask about a specific product or doctor by name, or tap \"Talk to a Human\" for more help.";
}
function mwToggle(open){
  mwChatOpen = open !== undefined ? open : !mwChatOpen;
  $('mwChatPanel').classList.toggle('open', mwChatOpen);
  if(mwChatOpen){
    mwRenderMessages();
    if(mwEscalated) mwListenSupportChat();
  }
}
function mwEscalate(){
  if(mwEscalated) return;
  mwEscalated = true;
  mwSaveState();
  mwAddMessage('bot', "Connecting you to our support team \u2014 they'll reply right here. You can also reach us anytime on WhatsApp.");
  db.collection('supportChats').doc(mwChatSessionId).set({
    status:'escalated',
    name: currentUserData?.name || 'Website Visitor',
    email: currentUserData?.email || '',
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    messages: mwChatMessages.filter(m=>m.sender!=='admin').map(m=>({sender: m.sender==='user'?'customer':'bot', text:m.text, ts: Date.now()}))
  }, {merge:true}).then(()=> mwListenSupportChat()).catch(err=> toast(err.message));
}
function mwListenSupportChat(){
  if(mwSupportUnsub) return;
  mwSupportUnsub = db.collection('supportChats').doc(mwChatSessionId).onSnapshot(doc=>{
    if(!doc.exists) return;
    const serverMsgs = doc.data().messages || [];
    serverMsgs.filter(m=>m.sender==='admin').forEach(am=>{
      const already = mwChatMessages.some(m=> m.sender==='admin' && m.text===am.text);
      if(!already) mwAddMessage('admin', am.text);
    });
  }, ()=>{});
}
function mwSend(){
  const input = $('mwChatInput');
  const val = input.value.trim();
  if(!val) return;
  input.value = '';
  mwAddMessage('user', val);
  if(mwEscalated){
    db.collection('supportChats').doc(mwChatSessionId).set({
      status:'escalated', updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      messages: firebase.firestore.FieldValue.arrayUnion({sender:'customer', text: val, ts: Date.now()})
    }, {merge:true}).catch(err=> toast(err.message));
    return;
  }
  setTimeout(()=>{
    mwBotReplyCount++;
    const reply = mwBestReply(val);
    mwAddMessage('bot', reply, mwBotReplyCount >= 4);
    mwSaveState();
  }, 350);
}
function mwInitWidget(){
  $('navChatLink').addEventListener('click', e=>{
    e.preventDefault();
    $('navLinks').classList.remove('open');
    mwToggle(true);
  });
  $('mwChatClose').addEventListener('click', ()=> mwToggle(false));
  $('mwChatSend').addEventListener('click', mwSend);
  $('mwChatInput').addEventListener('keypress', e=>{ if(e.key==='Enter') mwSend(); });
  delegate('mwChatPanel', '[data-mw-human]', 'click', ()=> mwEscalate());
  if(mwEscalated) mwListenSupportChat();
}

/* --- ADMIN: LIVE CHAT (human handoff for AI widget) --- */
async function adminSupportChats(c){
  c.innerHTML = `<div class="loading">Loading conversations...</div>`;
  const snap = await db.collection('supportChats').orderBy('updatedAt','desc').limit(50).get().catch(()=>null);
  let list = [];
  if(snap) snap.forEach(d=> list.push({id:d.id, ...d.data()}));
  if(!list.length){ c.innerHTML = `<div class="empty-state">No live chat conversations yet. Visitor chats that request a human will appear here.</div>`; return; }
  c.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Visitor</th><th>Status</th><th>Last Update</th><th>Actions</th></tr></thead>
    <tbody>${list.map(s=>`
      <tr data-id="${s.id}">
        <td>${escapeHtml(s.name||'Website Visitor')}${s.email?`<br><span style="font-size:11px;color:var(--muted);">${escapeHtml(s.email)}</span>`:''}</td>
        <td>${s.status==='resolved' ? '<span class="stock-in">Resolved</span>' : '<span class="stock-out">Needs Reply</span>'}</td>
        <td>${fmtDate(s.updatedAt)}</td>
        <td><button class="btn btn-sm btn-ghost" data-open-chat>Open</button></td>
      </tr>`).join('')}</tbody></table></div>`;
  delegate('adminTabContent','[data-open-chat]','click', el=> openAdminSupportChat(el.closest('tr').dataset.id, list));
}
let adminSupportUnsub = null;
function openAdminSupportChat(id, list){
  const s = list.find(x=>x.id===id) || {};
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal-box">
    <button class="modal-close" data-close>&times;</button>
    <h3>Chat with ${escapeHtml(s.name||'Website Visitor')}</h3>
    <div class="chat-wrap" style="height:50vh;margin-top:12px;">
      <div class="chat-msgs" id="adminChatMsgs"><div class="loading">Loading...</div></div>
      <div class="chat-input">
        <input type="text" id="adminChatText" placeholder="Reply to visitor...">
        <button id="adminChatSendBtn">\u27a4</button>
      </div>
    </div>
    <button class="btn btn-sm btn-ghost btn-block" id="adminResolveBtn" style="margin-top:10px;">Mark Resolved</button>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{
    if(e.target===overlay || e.target.closest('[data-close]')){
      if(adminSupportUnsub){ adminSupportUnsub(); adminSupportUnsub=null; }
      overlay.remove();
    }
  });
  if(adminSupportUnsub) adminSupportUnsub();
  adminSupportUnsub = db.collection('supportChats').doc(id).onSnapshot(doc=>{
    const data = doc.data() || {};
    const msgs = data.messages || [];
    const box = overlay.querySelector('#adminChatMsgs');
    if(!box) return;
    box.innerHTML = msgs.length ? msgs.map(m=>`
      <div class="msg ${m.sender==='admin'?'me':'them'}">${escapeHtml(m.text)}
        <span class="time">${m.sender==='admin'?'You':(m.sender==='customer'?'Visitor':'Assistant')}</span>
      </div>`).join('') : `<div class="empty-state">No messages yet.</div>`;
    box.scrollTop = box.scrollHeight;
  });
  const sendReply = ()=>{
    const val = overlay.querySelector('#adminChatText').value.trim();
    if(!val) return;
    overlay.querySelector('#adminChatText').value = '';
    db.collection('supportChats').doc(id).set({
      status:'escalated', updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      messages: firebase.firestore.FieldValue.arrayUnion({sender:'admin', text: val, ts: Date.now()})
    }, {merge:true}).catch(err=> toast(err.message));
  };
  overlay.querySelector('#adminChatSendBtn').addEventListener('click', sendReply);
  overlay.querySelector('#adminChatText').addEventListener('keypress', e=>{ if(e.key==='Enter') sendReply(); });
  overlay.querySelector('#adminResolveBtn').addEventListener('click', async ()=>{
    await db.collection('supportChats').doc(id).set({status:'resolved', updatedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
    toast('Marked resolved'); if(adminSupportUnsub){ adminSupportUnsub(); adminSupportUnsub=null; } overlay.remove();
    adminSupportChats($('adminTabContent'));
  });
}

  updateCartBadge();
  mwInitWidget(); // wire the chat button immediately - never blocked by data loading
  try{
    await Promise.all([loadProducts(), loadCategories(), loadDoctors(), loadFaqs(), loadTestimonials(), loadPricingPlans(), loadResultStats(), loadSettings()]);
  }catch(err){ console.error('init data load', err); }
  navigate('home');
}
init();
